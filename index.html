<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeToArt · 代码炼金术</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Fira+Code:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap');

        :root{
            --void:#070512;
            --obsidian:#0d0a1f;
            --violet:#7c3aed;
            --amethyst:#a855f7;
            --gold:#e9c46a;
            --gold-soft:#f4d58d;
            --ink:#e8e2f5;
        }

        *{ box-sizing:border-box; }

        body{
            background:
                radial-gradient(1200px 800px at 15% -10%, rgba(124,58,237,0.25), transparent 60%),
                radial-gradient(1000px 700px at 100% 0%, rgba(168,85,247,0.18), transparent 55%),
                radial-gradient(900px 900px at 50% 120%, rgba(233,196,106,0.10), transparent 60%),
                linear-gradient(180deg, #070512 0%, #0d0a1f 55%, #05030f 100%);
            color:var(--ink);
            font-family:'Lora','Noto Serif SC',serif;
            min-height:100vh;
            overflow:hidden;
        }

        #starfield{ position:fixed; inset:0; z-index:0; pointer-events:none; }

        .font-display{ font-family:'Cinzel',serif; }
        .font-code{ font-family:'Fira Code',monospace; }
        .font-art{ font-family:'Ma Shan Zheng',cursive; }
        .font-sc{ font-family:'Noto Serif SC',serif; }

        /* Ornate glass panel */
        .rune-panel{
            background:linear-gradient(160deg, rgba(20,14,40,0.72), rgba(10,7,24,0.6));
            backdrop-filter:blur(14px);
            border:1px solid rgba(168,85,247,0.28);
            box-shadow:0 0 0 1px rgba(233,196,106,0.06) inset, 0 18px 60px rgba(0,0,0,0.55), 0 0 40px rgba(124,58,237,0.12);
            position:relative;
        }
        .rune-panel::before{
            content:"";
            position:absolute; inset:0;
            background:
                radial-gradient(circle at 0% 0%, rgba(233,196,106,0.10), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(168,85,247,0.12), transparent 45%);
            pointer-events:none; border-radius:inherit;
        }

        .gold-text{
            background:linear-gradient(180deg,var(--gold-soft),var(--gold));
            -webkit-background-clip:text; background-clip:text; color:transparent;
        }

        /* Scrollbars */
        ::-webkit-scrollbar{ width:8px; height:8px; }
        ::-webkit-scrollbar-track{ background:rgba(255,255,255,0.03); }
        ::-webkit-scrollbar-thumb{ background:rgba(168,85,247,0.5); border-radius:4px; }
        ::-webkit-scrollbar-thumb:hover{ background:var(--gold); }

        .canvas-container{
            box-shadow:0 0 60px rgba(124,58,237,0.35), 0 0 0 1px rgba(233,196,106,0.15) inset;
            background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMGUxNjI4Ii8+CjxwYXRoIGQ9Ik0wIDBMNCA0Wk00IDBMMCA0WiIgc3Ryb2tlPSIjMTUyMzNhIiBvcGFjaXR5PSIwLjEiLz4KPC9zdmc+');
            cursor:pointer;
        }

        .btn-oracle{
            background:linear-gradient(135deg, var(--violet) 0%, var(--amethyst) 100%);
            border:1px solid rgba(233,196,106,0.35);
            transition:all .3s ease;
            position:relative; overflow:hidden;
        }
        .btn-oracle:hover{ transform:translateY(-1px); box-shadow:0 6px 22px rgba(168,85,247,0.5); }

        .btn-gold{
            background:linear-gradient(135deg, var(--gold) 0%, #c79a3a 100%);
            color:#1a1305; font-weight:700;
            transition:all .3s ease;
        }
        .btn-gold:hover{ transform:translateY(-1px); box-shadow:0 6px 20px rgba(233,196,106,0.4); }

        .loader{
            border:3px solid rgba(233,196,106,0.15);
            border-top-color:var(--gold);
            border-radius:50%; width:26px; height:26px;
            animation:spin 1s linear infinite;
        }
        @keyframes spin{ to{ transform:rotate(360deg);} }

        /* Tarot cards */
        .tarot-card{
            width:150px; height:240px; perspective:1200px; cursor:pointer;
        }
        .tarot-inner{
            position:relative; width:100%; height:100%; transform-style:preserve-3d;
            transition:transform 1s cubic-bezier(.2,.8,.2,1);
        }
        .tarot-card.flipped .tarot-inner{ transform:rotateY(180deg); }
        .tarot-face{
            position:absolute; inset:0; backface-visibility:hidden;
            border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center;
            border:1px solid rgba(233,196,106,0.4);
            box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 24px rgba(124,58,237,0.25);
            overflow:hidden;
        }
        .tarot-back{
            background:
                radial-gradient(circle at 50% 30%, rgba(168,85,247,0.35), transparent 60%),
                repeating-linear-gradient(45deg, rgba(233,196,106,0.08) 0 8px, transparent 8px 16px),
                linear-gradient(160deg,#1a1136,#0c0820);
        }
        .tarot-front{
            background:linear-gradient(170deg,#171030,#0b0718);
            transform:rotateY(180deg);
            padding:14px 10px; text-align:center;
        }
        .tarot-icon{ font-size:48px; filter:drop-shadow(0 0 10px rgba(233,196,106,0.6)); }
        .tarot-name{ font-family:'Cinzel',serif; color:var(--gold-soft); font-size:15px; margin-top:8px; font-weight:600; }
        .tarot-en{ font-size:10px; letter-spacing:1px; color:rgba(232,226,245,0.6); margin-top:2px; }
        .tarot-key{ font-size:11px; color:var(--amethyst); margin-top:6px; }

        .realm-fade{ animation:realmIn 1.1s ease both; }
        @keyframes realmIn{ from{ opacity:0; transform:scale(1.04);} to{ opacity:1; transform:scale(1);} }

        .fade-in{ animation:fadeIn 1.2s ease-in both; opacity:0; }
        @keyframes fadeIn{ to{ opacity:1; } }

        .tab-active{ color:var(--gold-soft); border-color:rgba(233,196,106,0.5); background:rgba(233,196,106,0.08); }

        .reading-section{ border-left:2px solid rgba(168,85,247,0.5); padding-left:12px; margin:14px 0; }
        .reading-section h4{ font-family:'Cinzel',serif; color:var(--gold-soft); font-size:13px; letter-spacing:1px; margin-bottom:6px; }

        .dropzone{ border:1.5px dashed rgba(168,85,247,0.4); transition:all .25s ease; }
        .dropzone.drag{ border-color:var(--gold); background:rgba(233,196,106,0.08); }
    </style>
</head>
<body class="h-screen flex flex-col">
    <canvas id="starfield"></canvas>

    <!-- Header -->
    <header class="relative z-10 h-16 border-b border-purple-900/50 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-3">
            <i class="fas fa-moon text-amber-300 text-xl"></i>
            <h1 class="font-display text-2xl font-bold tracking-wider">
                <span class="gold-text">CodeToArt</span>
                <span class="text-xs font-sans font-normal text-purple-300/70 ml-2 tracking-normal">代码炼金术 ✦</span>
            </h1>
        </div>
        <div class="flex items-center gap-4 text-sm text-purple-200/70">
            <button id="settingsBtn" class="hover:text-amber-300 transition-colors" title="灵媒设置">
                <i class="fas fa-sliders-h mr-1"></i> 灵媒
            </button>
            <span class="w-px h-4 bg-purple-800/60"></span>
            <a href="https://github.com/MiLab-Bit/CodeToArt" target="_blank" class="hover:text-amber-300 transition-colors"><i class="fab fa-github mr-1"></i> GitHub</a>
        </div>
    </header>

    <!-- Main -->
    <main class="relative z-10 flex-1 flex flex-col md:flex-row overflow-hidden">

        <!-- Left: Input -->
        <div class="w-full md:w-1/3 lg:w-1/4 flex flex-col border-r border-purple-900/40 rune-panel z-10">
            <div class="p-3 border-b border-purple-900/40 flex gap-1 text-xs">
                <button data-mode="paste" class="src-tab tab-active flex-1 py-1.5 rounded border border-purple-800/50 transition-colors">粘贴</button>
                <button data-mode="upload" class="src-tab flex-1 py-1.5 rounded border border-purple-800/50 transition-colors">上传</button>
                <button data-mode="repo" class="src-tab flex-1 py-1.5 rounded border border-purple-800/50 transition-colors">仓库</button>
            </div>

            <!-- paste -->
            <div id="mode-paste" class="flex-1 flex flex-col p-3 gap-2 min-h-0">
                <textarea id="codeInput" class="w-full flex-1 bg-[#0a0716] text-purple-100/90 p-3 font-code text-sm resize-none focus:outline-none rounded border border-purple-900/40 leading-relaxed transition-colors" spellcheck="false" placeholder="# 在此粘贴你的代码...\ndef dream():\n    while True:\n        yield '✨'"></textarea>
                <div class="flex gap-2">
                    <button onclick="loadExample('hello')" class="text-xs px-2 py-1 rounded bg-purple-900/50 hover:bg-purple-800/60 text-purple-200 transition-colors">Hello</button>
                    <button onclick="loadExample('chaos')" class="text-xs px-2 py-1 rounded bg-purple-900/50 hover:bg-purple-800/60 text-purple-200 transition-colors">Chaos</button>
                </div>
            </div>

            <!-- upload -->
            <div id="mode-upload" class="flex-1 flex flex-col p-3 gap-2 min-h-0 hidden">
                <div id="dropzone" class="dropzone flex-1 rounded flex flex-col items-center justify-center text-center p-4 cursor-pointer text-purple-200/70">
                    <i class="fas fa-cloud-arrow-up text-3xl text-amber-300/80 mb-2"></i>
                    <p class="text-sm">拖入代码文件，或点击选择</p>
                    <p class="text-[10px] text-purple-300/50 mt-1">支持任意文本/代码文件</p>
                </div>
                <input id="fileInput" type="file" accept=".txt,.py,.js,.ts,.jsx,.tsx,.java,.go,.rs,.c,.cpp,.h,.rb,.php,.json,.html,.css,.md,.sql,.sh" class="hidden">
                <p id="uploadName" class="text-xs text-amber-200/80 truncate"></p>
            </div>

            <!-- repo -->
            <div id="mode-repo" class="flex-1 flex flex-col p-3 gap-2 min-h-0 hidden">
                <input id="repoInput" type="text" placeholder="https://github.com/owner/repo" class="w-full bg-[#0a0716] text-purple-100/90 p-2.5 font-code text-xs rounded border border-purple-900/40 focus:outline-none">
                <button id="repoFetchBtn" class="btn-oracle py-2 rounded text-white text-sm font-medium flex items-center justify-center gap-2">
                    <i class="fas fa-hat-wizard"></i> 解析仓库
                </button>
                <div id="repoStatus" class="text-[11px] text-purple-300/60 break-words"></div>
                <p class="text-[10px] text-purple-300/40">无鉴权调用 GitHub API（有速率限制）。仅读取代码文本用于占卜。</p>
            </div>

            <!-- controls -->
            <div class="p-4 border-t border-purple-900/40 space-y-3">
                <div>
                    <div class="flex justify-between text-xs text-purple-300/80 mb-1">
                        <span>抽象程度 (Abstraction)</span>
                        <span id="abstractionVal" class="text-amber-300">8</span>
                    </div>
                    <input type="range" id="abstractionRange" min="1" max="10" value="8" class="w-full h-1 bg-purple-800 rounded-lg appearance-none cursor-pointer accent-amber-400">
                </div>
                <button id="generateBtn" class="btn-gold w-full py-3 rounded font-display tracking-wide flex justify-center items-center gap-2 text-sm">
                    <i class="fas fa-wand-magic-sparkles"></i> 凝炼艺术画
                </button>
            </div>
        </div>

        <!-- Right: Canvas -->
        <div class="flex-1 relative flex flex-col items-center justify-center p-4 md:p-8 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-40 pointer-events-none overflow-hidden">
                <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-900/20 rounded-full blur-3xl"></div>
                <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-amber-900/10 rounded-full blur-3xl"></div>
            </div>

            <div id="statsPanel" class="absolute top-6 right-6 rune-panel rounded-lg p-4 w-60 transform translate-x-full opacity-0 transition-all duration-500 z-20">
                <h3 class="text-xs font-bold text-purple-300/80 uppercase mb-3 border-b border-purple-800/50 pb-2 font-display tracking-widest">代码逻辑映射</h3>
                <ul class="space-y-3">
                    <li class="flex items-center justify-between text-sm"><span class="text-amber-300"><i class="fas fa-sun mr-2"></i>函数</span><span id="funcCount" class="font-code text-white">0</span></li>
                    <li class="flex items-center justify-between text-sm"><span class="text-cyan-300"><i class="fas fa-recycle mr-2"></i>循环</span><span id="loopCount" class="font-code text-white">0</span></li>
                    <li class="flex items-center justify-between text-sm"><span class="text-emerald-300"><i class="fas fa-code-branch mr-2"></i>分支</span><span id="branchCount" class="font-code text-white">0</span></li>
                    <li class="flex items-center justify-between text-sm"><span class="text-fuchsia-300"><i class="fas fa-fire mr-2"></i>熵能</span><span id="entropyVal" class="font-code text-white">0</span></li>
                    <li class="flex items-center justify-between text-sm"><span class="text-purple-200"><i class="fas fa-palette mr-2"></i>风格</span><span id="themeName" class="font-code text-white text-xs truncate max-w-[90px]">Classic</span></li>
                </ul>
            </div>

            <div class="relative canvas-container rounded-sm border-[8px] border-[#15102b] bg-[#050308] shadow-2xl max-w-full max-h-full aspect-square md:aspect-auto md:h-[82vh] md:w-auto overflow-hidden" id="canvasWrap">
                <canvas id="artCanvas" class="block w-full h-full"></canvas>
                <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-purple-300/60 bg-[#07040f]/90 z-10 transition-opacity duration-500">
                    <i class="fas fa-stars text-6xl mb-4 text-amber-300/70"></i>
                    <p class="font-display text-lg gold-text">献上你的代码</p>
                    <p class="text-xs text-purple-300/50 mt-2">凝炼成画 · 点击画作坠入幻境</p>
                </div>
                <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-20 hidden backdrop-blur-sm">
                    <div class="loader mb-4"></div>
                    <p id="loadingText" class="text-amber-200 font-display text-sm tracking-wider animate-pulse">炼金中…</p>
                </div>
            </div>

            <div id="actionBar" class="absolute bottom-8 flex gap-3 opacity-0 transition-opacity duration-500 transform translate-y-4 z-20">
                <button onclick="downloadArt()" class="rune-panel px-5 py-2 rounded-full text-purple-100 hover:text-amber-300 hover:bg-white/5 transition-colors flex items-center gap-2 text-sm">
                    <i class="fas fa-download"></i> 收藏
                </button>
                <button onclick="toggleAnimation()" class="rune-panel px-5 py-2 rounded-full text-purple-100 hover:text-amber-300 hover:bg-white/5 transition-colors flex items-center gap-2 text-sm">
                    <i class="fas fa-pause" id="pauseIcon"></i> <span id="pauseText">暂停</span>
                </button>
                <button onclick="enterRealm()" class="btn-oracle px-5 py-2 rounded-full text-white flex items-center gap-2 text-sm">
                    <i class="fas fa-door-open"></i> 进入幻境
                </button>
            </div>
        </div>
    </main>

    <!-- Realm Overlay -->
    <div id="realm" class="fixed inset-0 z-50 hidden items-center justify-center p-4 md:p-8 overflow-y-auto" style="background:radial-gradient(1200px 800px at 50% -10%, rgba(124,58,237,0.25), transparent 60%), linear-gradient(180deg,#05030f,#0d0a1f);">
        <div class="realm-fade w-full max-w-5xl rune-panel rounded-2xl p-6 md:p-10 relative">
            <button onclick="closeRealm()" class="absolute top-4 right-4 text-purple-300/70 hover:text-amber-300 text-xl"><i class="fas fa-xmark"></i></button>
            <div class="text-center mb-6">
                <p class="font-art text-3xl gold-text">命运幻境</p>
                <p class="text-xs text-purple-300/60 tracking-[0.3em] font-display mt-1">THE ORACLE'S REALM</p>
            </div>

            <div id="tarotStage" class="flex flex-wrap justify-center gap-5 md:gap-8 my-6"></div>

            <div class="flex flex-wrap justify-center gap-3 mb-4">
                <button id="drawBtn" class="btn-oracle px-6 py-2.5 rounded-full text-white text-sm font-medium flex items-center gap-2">
                    <i class="fas fa-cards-blank"></i> 抽取塔罗
                </button>
                <button id="revealBtn" class="btn-gold px-6 py-2.5 rounded-full text-sm font-medium flex items-center gap-2 opacity-40 pointer-events-none" disabled>
                    <i class="fas fa-eye"></i> 揭示解析
                </button>
                <button id="recolorBtn" class="rune-panel px-6 py-2.5 rounded-full text-purple-100 hover:text-amber-300 text-sm flex items-center gap-2 opacity-40 pointer-events-none" disabled>
                    <i class="fas fa-fill-drip"></i> 以塔罗之色重绘
                </button>
            </div>

            <div id="readingPanel" class="mt-4 max-h-[42vh] overflow-y-auto pr-2 text-sm leading-relaxed text-purple-100/90 font-sc"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/70 p-4">
        <div class="rune-panel rounded-xl p-6 w-full max-w-md relative">
            <button onclick="closeSettings()" class="absolute top-3 right-3 text-purple-300/70 hover:text-amber-300"><i class="fas fa-xmark"></i></button>
            <h3 class="font-display text-lg gold-text mb-1">灵媒设置</h3>
            <p class="text-[11px] text-purple-300/60 mb-4">不填也能玩：留空时由本地神秘学规则生成解析。填入任意兼容 OpenAI 的 API Key 可由 AI 增强解读。</p>
            <label class="block text-xs text-purple-300/80 mb-1">API Key（可选）</label>
            <input id="apiKey" type="password" placeholder="sk-..." class="w-full bg-[#0a0716] text-purple-100/90 p-2 rounded border border-purple-900/40 focus:outline-none text-sm mb-3">
            <label class="block text-xs text-purple-300/80 mb-1">Base URL</label>
            <input id="apiBase" type="text" placeholder="https://api.openai.com/v1" class="w-full bg-[#0a0716] text-purple-100/90 p-2 rounded border border-purple-900/40 focus:outline-none text-sm mb-3">
            <label class="block text-xs text-purple-300/80 mb-1">模型</label>
            <input id="apiModel" type="text" placeholder="gpt-4o-mini" class="w-full bg-[#0a0716] text-purple-100/90 p-2 rounded border border-purple-900/40 focus:outline-none text-sm mb-4">
            <div class="flex gap-2">
                <button onclick="saveSettings()" class="btn-gold flex-1 py-2 rounded text-sm font-medium">保存</button>
                <button onclick="closeSettings()" class="rune-panel flex-1 py-2 rounded text-purple-100 hover:text-amber-300 text-sm">取消</button>
            </div>
        </div>
    </div>

    <script>
    /* ============================================================
       0. 灵媒设置（localStorage，可选）
       ============================================================ */
    const oracleSettings = {
        key: localStorage.getItem('cta_key') || '',
        base: localStorage.getItem('cta_base') || 'https://api.openai.com/v1',
        model: localStorage.getItem('cta_model') || 'gpt-4o-mini'
    };

    /* ============================================================
       1. 星空背景
       ============================================================ */
    (function starfield(){
        const cv = document.getElementById('starfield');
        const ctx = cv.getContext('2d');
        let stars = [];
        function resize(){
            cv.width = innerWidth; cv.height = innerHeight;
            stars = Array.from({length: Math.min(220, Math.floor(innerWidth*innerHeight/9000))}, () => ({
                x: Math.random()*cv.width, y: Math.random()*cv.height,
                r: Math.random()*1.4+0.2, a: Math.random(), s: Math.random()*0.02+0.004
            }));
        }
        function tick(){
            ctx.clearRect(0,0,cv.width,cv.height);
            for(const st of stars){
                st.a += st.s; const tw = 0.5 + 0.5*Math.sin(st.a);
                ctx.globalAlpha = tw*0.9;
                ctx.fillStyle = tw>0.7 ? '#f4d58d' : '#b39ddb';
                ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(tick);
        }
        addEventListener('resize', resize); resize(); tick();
    })();

    /* ============================================================
       2. 大阿尔克那塔罗牌（22 张）
       ============================================================ */
    const TAROT = [
        {n:'愚者', en:'The Fool', icon:'🃏', color:'#f6c177', energy:'启程', up:'纯真无畏的开端，放手一搏便有奇遇。'},
        {n:'魔术师', en:'The Magician', icon:'🪄', color:'#c4a7e7', energy:'显化', up:'万物皆可为工具，意志即魔法。'},
        {n:'女祭司', en:'The High Priestess', icon:'🌙', color:'#9bb4d4', energy:'直觉', up:'静默中藏真理，倾听内在之声。'},
        {n:'皇后', en:'The Empress', icon:'👑', color:'#e0a3c0', energy:'丰饶', up:'滋养与创造，繁茂自温柔而生。'},
        {n:'皇帝', en:'The Emperor', icon:'♔', color:'#d98c6a', energy:'秩序', up:'结构立根基，权威成方圆。'},
        {n:'教皇', en:'The Hierophant', icon:'🔑', color:'#caa46a', energy:'传承', up:'遵循范式，旧智引新路。'},
        {n:'恋人', en:'The Lovers', icon:'💞', color:'#e89ab0', energy:'联结', up:'关键抉择，心意相印则通。'},

    /* ============================================================
       3. 代码分析引擎
       ============================================================ */
    function regexAnalyze(code){
        const functions = (code.match(/def\s+\w+|function\s+\w+|class\s+\w+|=>\s*[{]/g) || []).length;
        const loops = (code.match(/\b(for|while)\b/g) || []).length;
        const branches = (code.match(/\b(if|elif|else if|else)\b/g) || []).length;
        const length = code.length;
        const entropy = Math.min(Math.round(functions*2 + loops*3 + branches + length/120), 100);
        const seeds = [];
        const lines = code.split('\n');
        lines.forEach((line, i) => {
            const y = i / Math.max(1, lines.length);
            if (/def\s+\w+|function\s+\w+|class\s+\w+/.test(line)) seeds.push({type:'star', y});
            if (/\b(for|while)\b/.test(line)) seeds.push({type:'swirl', y});
            if (/\b(if|elif|else)\b/.test(line)) seeds.push({type:'break', y});
        });
        return { functions, loops, branches, entropy, seeds, length };
    }

    class Particle{
        constructor(w,h,analysis,paletteOverride){
            this.w=w; this.h=h; this.analysis=analysis;
            this.palette=paletteOverride||defaultPalette; this.reset();
        }
        reset(){
            this.x=Math.random()*this.w; this.y=Math.random()*this.h;
            this.pos={x:this.x,y:this.y}; this.vel={x:0,y:0}; this.acc={x:0,y:0};
            this.maxSpeed=2+Math.random()*2; this.prevPos={x:this.x,y:this.y};
            const pLen=this.palette.length;
            const baseIdx=Math.max(0,Math.floor(Math.random()*Math.max(1,pLen-3)));
            const accentIdx=Math.min(pLen-1,Math.floor(Math.random()*2+pLen-3));
            this.color=(Math.random()<0.12)?this.palette[accentIdx]:this.palette[baseIdx];
            if(!this.color) this.color=this.palette[Math.floor(Math.random()*pLen)]||'#ffffff';
            this.strokeWidth=(Math.random()*3+1)*currentStrokeScale;
            this.life=Math.random()*100+50;
        }
        update(flowField,cols){
            this.prevPos.x=this.pos.x; this.prevPos.y=this.pos.y;
            const x=Math.floor(this.pos.x/scale), y=Math.floor(this.pos.y/scale);
            const index=x+y*cols;
            if(flowField[index]){
                const angle=flowField[index].angle;
                this.acc.x=Math.cos(angle); this.acc.y=Math.sin(angle);
            }
            this.vel.x+=this.acc.x; this.vel.y+=this.acc.y;
            const speed=Math.sqrt(this.vel.x*this.vel.x+this.vel.y*this.vel.y);
            if(speed>this.maxSpeed){ this.vel.x=(this.vel.x/speed)*this.maxSpeed; this.vel.y=(this.vel.y/speed)*this.maxSpeed; }
            this.pos.x+=this.vel.x; this.pos.y+=this.vel.y;
            this.acc.x=0; this.acc.y=0; this.life--;
            if(this.pos.x>this.w||this.pos.x<0||this.pos.y>this.h||this.pos.y<0||this.life<0) this.reset();
        }
        show(ctx){
            ctx.beginPath(); ctx.lineWidth=this.strokeWidth; ctx.strokeStyle=this.color;
            ctx.lineCap='round'; ctx.moveTo(this.prevPos.x,this.prevPos.y); ctx.lineTo(this.pos.x,this.pos.y);
            ctx.globalAlpha=0.6; ctx.stroke(); ctx.globalAlpha=1.0;
        }
    }

    function initFlowField(analysis,w,h,turb=1.0){
        flowField=[]; cols=Math.floor(w/scale)+1; rows=Math.floor(h/scale)+1;
        for(let y=0;y<rows;y++){
            for(let x=0;x<cols;x++){
                let index=x+y*cols;
                let angle=(x/cols)*Math.PI+(y/rows)*0.5;
                analysis.seeds.forEach(seed=>{
                    const seedY=seed.y*rows, seedX=(seed.y*12345%cols);
                    const dx=x-seedX, dy=y-seedY, dist=Math.sqrt(dx*dx+dy*dy);
                    const radius=(seed.type==='star')?15:20;
                    if(dist<radius){
                        if(seed.type==='star'){ angle=Math.atan2(dy,dx)+Math.PI/2; }
                        else if(seed.type==='swirl'){ angle=Math.atan2(dy,dx)+dist*0.2*turb; }
                        else if(seed.type==='break'){ angle+=(Math.random()*2-1)*turb; }
                    }
                });
                angle+=Math.sin(x*0.1)+Math.cos(y*0.1);
                flowField[index]={angle};
            }
        }
    }

    function resizeCanvas(){
        const container=document.getElementById('canvasWrap');
        const cw=container.clientWidth, ch=container.clientHeight;
        dpr=window.devicePixelRatio||1;
        canvas.width=Math.floor(cw*dpr); canvas.height=Math.floor(ch*dpr);
        canvas.style.width=cw+'px'; canvas.style.height=ch+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function getCssSize(){ return {w:canvas.clientWidth,h:canvas.clientHeight}; }
    let resizeTimer;
    addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{

    },200); });

    function initCanvasAndParticles(analysis,count,turb,pal,w,h){
        w=(w!==undefined)?w:canvas.clientWidth; h=(h!==undefined)?h:canvas.clientHeight;
        ctx.fillStyle=pal[0]; ctx.fillRect(0,0,w,h);
        initFlowField(analysis,w,h,turb); particles=[];
        for(let i=0;i<count;i++) particles.push(new Particle(w,h,analysis,pal));
        drawStars(analysis,pal,w,h);
    }
    function drawStars(analysis,pal,w,h){
        const starColor=pal[pal.length-2]||'#fff';
        analysis.seeds.filter(s=>s.type==='star').forEach(seed=>{
            const x=(seed.y*12345%cols)*scale, y=seed.y*h;
            const g=ctx.createRadialGradient(x,y,5,x,y,60);
            g.addColorStop(0,hexToRgba(starColor,0.9));
            g.addColorStop(0.4,hexToRgba(pal[pal.length-3]||starColor,0.4));
            g.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,60,0,Math.PI*2); ctx.fill();
        });
    }
    function hexToRgba(hex,a){
        let c; if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
            c=hex.substring(1).split(''); if(c.length===3) c=[c[0],c[0],c[1],c[1],c[2],c[2]];
            c='0x'+c.join(''); return 'rgba('+[(c>>16)&255,(c>>8)&255,c&255].join(',')+','+a+')';
        } return 'rgba(255,255,255,'+a+')';
    }
    function animate(){
        if(!isAnimating) return;
        for(const p of particles){ p.update(flowField,cols); p.show(ctx); }
        animationId=requestAnimationFrame(animate);
    }
    function updateStats(analysis){
        animateValue('funcCount',0,analysis.functions,1000);

    function animateValue(id,start,end,duration){
        if(start===end){ document.getElementById(id).innerText=end; return; }
        const obj=document.getElementById(id); const range=end-start; let cur=start;
        const inc=end>start?1:-1; const step=Math.max(50,Math.abs(Math.floor(duration/range)));
        const t=setInterval(()=>{ cur+=inc; obj.innerText=cur; if(cur===end) clearInterval(t); }, step);
    }

    async function fetchRepo(){
        const raw=repoInput.value.trim();
        if(!raw){ repoStatus.innerText='请输入仓库地址'; return; }
        const m=raw.match(/github\.com\/([^\/\s?#]+)\/([^\/\s?#]+)/);
        if(!m){ repoStatus.innerText='无法识别 GitHub 仓库地址'; return; }
        let owner=m[1], repo=m[2].replace(/\.git$/,'');
        let branch=null;
        const bb=raw.match(/[@/]([^\/\s?#]+)$/); // crude branch after @ or trailing
        repoStatus.innerText='连接星界网关…';
        try{
            const info=await fetch(`https://api.github.com/repos/${owner}/${repo}`).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
            branch=info.default_branch||'main';
            const tree=await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`).then(r=>r.json());
            const codeExt=['.py','.js','.ts','.jsx','.tsx','.java','.go','.rs','.c','.cpp','.h','.rb','.php','.json','.html','.css','.md','.sql','.sh','.vue'];
            let files=(tree.tree||[]).filter(t=>t.type==='blob' && codeExt.some(e=>t.path.endsWith(e)) && !/(node_modules|\.git\/|dist\/|build\/|vendor\/)/.test(t.path))
                .sort((a,b)=>(b.size||0)-(a.size||0)).slice(0,10);
            if(!files.length){ repoStatus.innerText='仓库中未找到代码文件'; return; }
            repoStatus.innerText='汲取代码星火 ('+files.length+' 个文件)…';
            let collected=[], total=0;
            for(const f of files){
                if(total>24000) break;
                const content=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${f.path}?ref=${branch}`).then(r=>r.json());
                if(content && content.content){
                    const text=decodeURIComponent(escape(atob(content.content.replace(/\n/g,''))));
                    collected.push('// === '+f.path+' ===\n'+text); total+=text.length;
                }
            }
            codeInput.value=collected.join('\n\n');
            currentSeedMetaLabel=repo+'@'+branch;
            repoStatus.innerText='已解析 '+files.length+' 个文件，共 '+total+' 字符。点击「凝炼艺术画」。';
        }catch(err){
            repoStatus.innerText='解析失败：'+(err.message||err)+'（可能触发 GitHub API 速率限制）';
        }
    }

    async function callOracle(analysis,cards){

        const snippet=getCurrentCode().slice(0,1500);
        const prompt=`你是一位结合塔罗神秘学与代码审美的「灵媒」。
请基于以下三牌阵与代码结构，给出一段富有神秘学气息的中文代码 review 与解析（300字内，分点、诗意、可操作）。

    function generateLocalReading(analysis,cards){
        const positions=[
            {pos:SPREAD[0],c:cards[0]},
            {pos:SPREAD[1],c:cards[1]},
            {pos:SPREAD[2],c:cards[2]}
        ];
        let html='<div class="reading-section"><h4>✦ 三牌阵 · 代码命运</h4>';
        positions.forEach(p=>{
            html+=`<p class="mb-1"><span class="text-amber-300 font-display">${p.pos}</span> · <b>${p.c.icon} ${p.c.n}</b>（${p.c.energy}）<br><span class="text-purple-200/80 text-[13px]">${p.c.up}</span></p>`;
        });
        html+='</div>';

        // 结构占卜
        let struct;
        if(analysis.functions===0&&analysis.loops===0) struct='此代码尚无一法一循环，如太初之卵，静待破壳之念。';
        else if(analysis.entropy>=70) struct='熵能汹涌（'+analysis.entropy+'），逻辑如星暴般纷繁，暗藏混沌之力，亦藏惊人之美。';
        else if(analysis.entropy<=25) struct='熵能清浅（'+analysis.entropy+'），结构澄明如镜，宜守其简。';
        else struct='熵能中和（'+analysis.entropy+'），刚柔相济，是可塑之器。';
        html+=`<div class="reading-section"><h4>✦ 代码结构占卜</h4><p>${struct}</p>`;
        html+=`<p class="text-[13px] text-purple-200/80">函数 ${analysis.functions} · 循环 ${analysis.loops} · 分支 ${analysis.branches}。${adviceLine(analysis)}</p></div>`;

        // 综合解析 + 运势
        const fortunes=['大吉 · 灵光乍现','中平 · 静水流深','需谨慎 · 暗流潜涌'];
        const luck=fortunes[(analysis.entropy + cards[0].n.length + cards[2].energy.length)%3];
        const combined=cards.map(c=>c.energy).join('、');
        html+=`<div class="reading-section"><h4>✦ 综合解析</h4><p>三牌能量「${combined}」交织于你的代码气场。`;
        html+=` ${cards[1].n}昭示当下：当以「${cards[1].energy}」之心面对此代码——${cards[1].up}</p>`;
        html+=`<p class="mt-1 text-[13px] text-amber-200/80">运势评级：<b>${luck}</b></p></div>`;

        return html;
    }
    function adviceLine(a){
        const tips=[];
        if(a.functions>12) tips.push('函数繁若星辰，宜归并同类以安神明');
        if(a.loops>8) tips.push('循环如轮回，宜抽离为函数以息妄念');
        if(a.branches>10) tips.push('分支交错成迷宫，宜以查表或策略化简');
        if(a.entropy>70) tips.push('混沌之中藏力，宜补注释以引后来者');
        if(!tips.length) tips.push('结构已和，且饮一杯清茶');
        return tips.join('；')+'。';
    }
    function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
