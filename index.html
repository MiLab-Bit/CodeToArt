<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeToArt · 代码炼金术</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen flex flex-col">

    <canvas id="starfield"></canvas>

    <!-- Header -->
    <header class="relative z-10 flex items-center justify-between px-7 h-16 shrink-0 topbar">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-moon" style="color:#c9a96a"></i>
            <h1 class="font-display text-2xl tracking-[0.16em]">
                <span class="gold-text">CodeToArt</span>
                <span class="text-[11px] font-normal text-muted-2 ml-3 tracking-[0.3em]">代码炼金术 · ALCHEMY</span>
            </h1>
        </div>
        <div class="flex items-center gap-5 text-sm">
            <button id="settingsBtn" class="text-muted hover:text-[#e6cd9a] transition-colors duration-300">
                <i class="fa-solid fa-sliders mr-1.5"></i> 灵媒
            </button>
            <div class="divider"></div>
            <a href="https://github.com/MiLab-Bit/CodeToArt" target="_blank" class="text-muted hover:text-[#e6cd9a] transition-colors duration-300"><i class="fa-brands fa-github mr-1.5"></i> GitHub</a>
        </div>
    </header>

    <!-- Main -->
    <main class="relative z-10 flex-1 flex flex-col md:flex-row overflow-hidden">

        <!-- Left: Input -->
        <div class="w-full md:w-1/3 lg:w-1/4 flex flex-col panel" style="border-width:0 1px 0 0; border-color:var(--line);">
            <div class="p-4 flex gap-2">
                <button data-mode="paste" class="tab tab-active" style="flex:1">粘贴</button>
                <button data-mode="upload" class="tab" style="flex:1">上传</button>
                <button data-mode="repo" class="tab" style="flex:1">仓库</button>
            </div>

            <!-- paste -->
            <div id="mode-paste" class="flex-1 flex flex-col p-4 gap-3 min-h-0">
                <textarea id="codeInput" class="field flex-1 resize-none" spellcheck="false" placeholder="# 在此粘贴你的代码...&#10;def dream():&#10;    while True:&#10;        yield '✦'"></textarea>
                <div class="flex gap-2">
                    <button id="exampleHello" class="btn btn-ghost text-xs" style="padding:.4rem .8rem">Hello</button>
                    <button id="exampleChaos" class="btn btn-ghost text-xs" style="padding:.4rem .8rem">Chaos</button>
                </div>
            </div>

            <!-- upload -->
            <div id="mode-upload" class="flex-1 flex flex-col p-4 gap-3 min-h-0 hidden">
                <div id="dropzone" class="dropzone flex-1 rounded-xl flex flex-col items-center justify-center text-center p-4 cursor-pointer text-muted">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl mb-3" style="color:#c9a96a"></i>
                    <p class="text-sm">拖入代码文件，或点击选择</p>
                    <p class="text-[11px] text-muted-2 mt-1.5">支持任意文本 / 代码文件</p>
                </div>
                <input id="fileInput" type="file" accept=".txt,.py,.js,.ts,.jsx,.tsx,.java,.go,.rs,.c,.cpp,.h,.rb,.php,.json,.html,.css,.md,.sql,.sh" class="hidden">
                <p id="uploadName" class="text-xs truncate" style="color:#e6cd9a"></p>
            </div>

            <!-- repo -->
            <div id="mode-repo" class="flex-1 flex flex-col p-4 gap-3 min-h-0 hidden">
                <input id="repoInput" type="text" class="field" placeholder="https://github.com/owner/repo">
                <button id="repoFetchBtn" class="btn btn-solid py-2.5">
                    <i class="fa-solid fa-hat-wizard"></i> 解析仓库
                </button>
                <div id="repoStatus" class="text-[11px] text-muted break-words leading-relaxed"></div>
                <p class="text-[11px] text-muted-2 leading-relaxed">无鉴权调用 GitHub API（有速率限制）。仅读取代码文本用于占卜。</p>
            </div>

            <!-- controls -->
            <div class="p-5 space-y-5" style="border-top:1px solid var(--line)">
                <div>
                    <div class="flex justify-between text-xs text-muted mb-2.5">
                        <span class="tracking-wide">抽象程度 · ABSTRACTION</span>
                        <span id="abstractionVal" style="color:#e6cd9a">8</span>
                    </div>
                    <input type="range" id="abstractionRange" min="1" max="10" value="8" class="w-full">
                </div>
                <button id="generateBtn" class="btn btn-solid w-full py-3 font-display tracking-[0.14em] text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 凝炼艺术画
                </button>
            </div>
        </div>

        <!-- Right: Canvas -->
        <div class="flex-1 relative flex flex-col items-center justify-center p-4 md:p-10 overflow-hidden">
            <div id="statsPanel" class="absolute top-6 right-6 panel rounded-xl p-5 w-60 transform translate-x-full opacity-0 transition-all duration-500 z-20">
                <h3 class="kicker mb-3" style="color:var(--gold); border-bottom:1px solid var(--line); padding-bottom:.7rem">代码逻辑映射</h3>
                <div>
                    <div class="stat-row"><span class="stat-label"><i class="fa-solid fa-sun"></i>函数</span><span id="funcCount" class="stat-val">0</span></div>
                    <div class="stat-row"><span class="stat-label"><i class="fa-solid fa-recycle"></i>循环</span><span id="loopCount" class="stat-val">0</span></div>
                    <div class="stat-row"><span class="stat-label"><i class="fa-solid fa-code-branch"></i>分支</span><span id="branchCount" class="stat-val">0</span></div>
                    <div class="stat-row"><span class="stat-label"><i class="fa-solid fa-fire"></i>熵能</span><span id="entropyVal" class="stat-val">0</span></div>
                    <div class="stat-row"><span class="stat-label"><i class="fa-solid fa-palette"></i>风格</span><span id="themeName" class="stat-val text-xs truncate" style="max-width:90px">Classic</span></div>
                </div>
            </div>

            <div class="canvas-frame rounded-sm max-w-full max-h-full aspect-square md:aspect-auto md:h-[82vh] md:w-auto overflow-hidden" id="canvasWrap">
                <div class="canvas-container relative w-full h-full">
                    <canvas id="artCanvas" class="block w-full h-full"></canvas>
                    <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-muted bg-[#07040f]/92 z-10 transition-opacity duration-500" style="background:rgba(7,4,15,.92)">
                        <i class="fa-solid fa-stars text-5xl mb-5" style="color:rgba(201,169,106,.7)"></i>
                        <p class="font-display text-lg gold-text tracking-[0.1em]">献上你的代码</p>
                        <p class="text-xs text-muted-2 mt-2.5 tracking-wide">凝炼成画 · 点击画作坠入幻境</p>
                    </div>
                    <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/75 z-20 hidden backdrop-blur-sm">
                        <div class="loader mb-4"></div>
                        <p id="loadingText" class="text-[#e6cd9a] font-display text-sm tracking-[0.2em] animate-pulse">炼金中…</p>
                    </div>
                </div>
            </div>

            <div id="actionBar" class="absolute bottom-8 flex gap-3 opacity-0 transition-opacity duration-500 transform translate-y-4 z-20">
                <button id="downloadBtn" class="btn btn-ghost"><i class="fa-solid fa-download"></i> 收藏</button>
                <button id="pauseBtn" class="btn btn-ghost"><i class="fa-solid fa-pause" id="pauseIcon"></i> <span id="pauseText">暂停</span></button>
                <button id="enterRealmBtn" class="btn btn-solid"><i class="fa-solid fa-door-open"></i> 进入幻境</button>
            </div>
        </div>
    </main>

    <!-- Realm Overlay -->
    <div id="realm" class="fixed inset-0 z-50 hidden items-center justify-center p-4 md:p-8 overflow-y-auto scrim">
        <div class="realm-fade w-full max-w-5xl panel rounded-2xl p-7 md:p-11 relative">
            <button id="closeRealmBtn" class="absolute top-4 right-5 text-muted hover:text-[#e6cd9a] text-xl transition-colors duration-300"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center mb-7">
                <p class="font-art text-4xl gold-text">命运幻境</p>
                <p class="kicker mt-2" style="color:var(--gold)">THE ORACLE'S REALM</p>
            </div>

            <div id="tarotStage" class="flex flex-wrap justify-center gap-6 md:gap-9 my-8"></div>

            <div class="flex flex-wrap justify-center gap-3 mb-4">
                <button id="drawBtn" class="btn btn-solid py-2.5"><i class="fa-solid fa-cards-blank"></i> 抽取塔罗</button>
                <button id="revealBtn" class="btn btn-solid py-2.5 opacity-40 pointer-events-none" disabled><i class="fa-solid fa-eye"></i> 揭示解析</button>
                <button id="recolorBtn" class="btn btn-ghost py-2.5 opacity-40 pointer-events-none" disabled><i class="fa-solid fa-fill-drip"></i> 以塔罗之色重绘</button>
            </div>

            <div id="readingPanel" class="mt-5 max-h-[42vh] overflow-y-auto pr-2 font-serif" style="font-size:1rem"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-[60] hidden items-center justify-center scrim p-4">
        <div class="panel rounded-2xl p-7 w-full max-w-md relative">
            <button id="closeSettingsBtn" class="absolute top-4 right-5 text-muted hover:text-[#e6cd9a] transition-colors duration-300"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="font-display text-lg gold-text tracking-wide">灵媒设置</h3>
            <p class="text-[11px] text-muted leading-relaxed mt-2 mb-5">不填也能玩：留空时由本地神秘学规则生成解析。填入任意兼容 OpenAI 的 API Key 可由 AI 增强解读。</p>
            <label class="block text-xs text-muted mb-1.5 tracking-wide">API Key（可选）</label>
            <input id="apiKey" type="password" placeholder="sk-..." class="field mb-3.5">
            <label class="block text-xs text-muted mb-1.5 tracking-wide">Base URL</label>
            <input id="apiBase" type="text" placeholder="https://api.openai.com/v1" class="field mb-3.5">
            <label class="block text-xs text-muted mb-1.5 tracking-wide">模型</label>
            <input id="apiModel" type="text" placeholder="gpt-4o-mini" class="field mb-5">
            <div class="flex gap-2">
                <button id="saveSettingsBtn" class="btn btn-solid flex-1">保存</button>
                <button id="cancelSettingsBtn" class="btn btn-ghost flex-1">取消</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
